title: sim-mesh
tagline: Radio propagation & coverage planning
description: >-
  sim-mesh runs real LoRa mesh firmware, built as Linux processes, over a
  model of the radio chip and one medium that decides who hears what from the
  geodata they stand on, in real time or in virtual time.
email: crew@sim-mesh.net
# Where the site's GitHub links go: the sim-mesh repository, as the
# organisation's own front page has nothing on it yet.
github: https://github.com/sim-mesh/sim-mesh

# The site's own domain. Jekyll builds `absolute_url` — the canonical link and
# every entry in the sitemap — from this. Which host the deploy answers on is
# the repo's Pages setting; see README, "The domain".
url: https://sim-mesh.net
baseurl: ""

nav:
  - name: Getting started
    url: /getting-started/
  - name: Firmware
    url: /using-firmware/
    children:
      - name: Building firmware
        url: /using-firmware/building/
  - name: Pre-built
    url: /firmware/
  - name: Simulation
    url: /simulation/
    children:
      - name: Scripting
        url: /simulation/scripting/

permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  # /firmware/ is laid in by .github/workflows/pages.yml after Jekyll has run:
  # the `firmware` release of sim-mesh/sim-mesh, its zips and index.html.
