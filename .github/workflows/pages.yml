name: Deploy site

# The published site is assembled from two sources, neither of which puts a
# binary in this repo's history:
#
#   this repo            the Jekyll pages
#   sim-mesh/sim-mesh    its CONTRACT.md, the firmware contract, as the page
#                        /using-firmware/building/; and its `firmware`
#                        release, unpacked to /firmware/
#
# The contract lives beside the code that keeps it, and the site shows that
# one file: a deploy takes it from sim-mesh's main. A daily deploy picks up a
# change to it without anything here changing.
#
# The release is the store of pre-built firmware: every zip, firmware.yaml and
# the index.html made from it, which sim-mesh's `firmware prebuilt` and the
# Firmware tab read. A browser cannot fetch a release asset across origins, so
# a deploy copies them into the site, same-origin with the pages.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # sim-mesh's `sim firmware publish` fires this after it has uploaded to the
  # release, so new firmware is on the site without a commit here.
  repository_dispatch:
    types: [firmware-published]
  schedule:
    - cron: '17 4 * * *'

env:
  FIRMWARE_REPO: sim-mesh/sim-mesh

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout sim-mesh's contract
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FIRMWARE_REPO }}
          path: _sim-mesh
          sparse-checkout: CONTRACT.md
          sparse-checkout-cone-mode: false

      - name: The contract as its page
        run: python3 _tools/contract.py _sim-mesh/CONTRACT.md

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the Jekyll site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Asked with the workflow's token: unauthenticated, the API's rate limit
      # is shared by every job on the runner's address, and refuses with 403.
      # No release (404) is an empty list; any other failure fails the deploy,
      # so a refused request never replaces the list with an empty one.
      - name: Add the pre-built firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${FIRMWARE_REPO}/releases/tags/firmware"
          dest="_site/firmware"
          mkdir -p "$dest"
          status="$(curl -sSL -o release.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" "$api")"
          if [ "$status" = 404 ]; then
            echo "::warning::no firmware release in ${FIRMWARE_REPO} — /firmware/ lists nothing"
            printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Pre-built firmware</title>' \
              '<h1>Pre-built firmware</h1><p>None published yet.</p>' > "$dest/index.html"
            exit 0
          fi
          if [ "$status" != 200 ]; then
            echo "::error::asking for ${FIRMWARE_REPO}'s firmware release: HTTP ${status}"
            cat release.json
            exit 1
          fi
          # Every asset, named as it was uploaded: the release is the directory.
          jq -r '.assets[] | [.name, .browser_download_url] | @tsv' release.json \
          | while IFS="$(printf '\t')" read -r name url; do
              curl -fsSL --retry 3 -o "${dest}/${name}" "$url"
            done
          test -f "$dest/index.html"
          echo "firmware: $(find "$dest" -name '*.zip' | wc -l) zips, $(du -sh "$dest" | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
